openapi: 3.0.0
servers:
  # - description: SwaggerHub API Auto Mocking
  #   url: https://virtserver.swaggerhub.com/OlavHjertaker/AccountingAPI/1.0.0
  - description: Bilberry API v3
    url: https://bilberry.test/api/v3/accounting
info:
  description: "API for retrieving invoices, vats and payment methods"
  version: 1.0.0
  title: Bilberry accounting API
tags:
  - name: invoices
    description: Bilberry invoices
  - name: account ledgers
    description: VATs and payment methods
  - name: external
    description: Accounting system reference data stored on Bilberry invoices
paths:
  /invoices:
    get:
      security:
        - bearerAuth: []
      tags:
        - invoices
      summary: lists invoices
      operationId: getInvoices
      description: |
        Returns invoices from selected time period.

        Membership invoices and invoices with payment method "invoiced on private event" are always excluded.
        Unpaid invoices with the Online payment method are excluded unless `include_unpaid_online=1`.

        Invoices are sorted newest first by the selected `date_field` (by invoice ID when `date_field=closed_at`).
      parameters:
        - in: query
          name: start_date
          description: |
            Optional start date in YYYY-mm-dd format.
            If neither `start_date` nor `end_date` is set, the period is from the start of last month to the end of the current month.
            If only `start_date` is set, only that single day is returned.
          required: false
          schema:
            type: string
            format: date
            example: 2024-07-01
        - in: query
          name: end_date
          description: Optional end date in YYYY-mm-dd format. Must not be before `start_date`
          required: false
          schema:
            type: string
            format: date
            example: 2024-07-31
        - in: query
          name: date_field
          description: Date field to filter by. `closed_at` is the date the invoice was paid, or the credit note was refunded
          schema:
            type: string
            enum: [invoice_date, delivery_date, updated_at, closed_at]
            default: invoice_date
        - in: query
          name: type
          description: Filter by invoices or credit notes (both by default)
          schema:
            type: string
            enum: [invoice, creditnote]
        - $ref: '#/components/parameters/IncludeUnpaidOnline'
      responses:
        '200':
          description: Invoices matching selected filters
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Invoice'
                  meta:
                    type: object
                    description: "All totals exclude cancelled invoices"
                    properties:
                      subtotal:
                        type: number
                        description: "Total inc. VAT from orderlines"
                        example: 120000
                      payments_total:
                        type: number
                        description: "Total payments"
                        example: 100000
                      balance:
                        type: number
                        description: "subtotal - payments_total for open and closed invoices (cancelled invoices are ignored)"
                        example: 20000
                      subtotal_ex_vat:
                        type: number
                        description: "Total ex. VAT from orderlines"
                        example: 107142.86
                      vat_total:
                        type: number
                        description: "Total VAT from orderlines"
                        example: 12857.14
                      giftcard_purchases_total_ex_vat:
                        type: number
                        description: "Total ex. VAT of giftcard purchases"
                        example: 0
                      subtotal_ex_vat_ex_giftcard_purchases:
                        type: number
                        description: "subtotal_ex_vat - giftcard_purchases_total_ex_vat"
                        example: 107142.86
                      start_date:
                        type: string
                        format: date-time
                        example: 2024-07-01 00:00:00
                      end_date:
                        type: string
                        format: date-time
                        example: 2024-07-31 23:59:59
                      date_field:
                        type: string
                        enum: [invoice_date, delivery_date, updated_at, closed_at]
                        example: "delivery_date"
                      type:
                        type: string
                        enum: [invoice, creditnote]
                        example: "invoice"
                      item_count:
                        type: integer
                        description: "Number of invoices returned"
                        example: 52
                  warnings:
                   $ref: '#/components/schemas/InvoiceWarnings'

        '400':
          description: "Invalid input parameters: invalid type, date_field or start/end dates, or start date after end date"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: "Invalid start/end dates"
                message: "Start date must be before end date"
                code: 400
        '500':
          description: An error occurred while fetching data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /invoices/{invoice_id}:
    get:
      security:
        - bearerAuth: []
      tags:
        - invoices
      summary: "Lookup single invoice"
      operationId: getInvoice
      description: "Find specified invoice"
      parameters:
        - in: path
          name: invoice_id
          description: "Invoice ID to look up"
          required: true
          schema:
            type: integer
        - $ref: '#/components/parameters/IncludeUnpaidOnline'
      responses:
        '200':
          description: "Invoice found"
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    allOf:
                      - $ref: '#/components/schemas/Invoice'
                      - type: object
                        properties:
                          creditnotes:
                            type: array
                            description: "Credit notes created from this invoice"
                            items:
                              $ref: '#/components/schemas/Invoice'
                  meta:
                    type: object
                    properties:
                      invoice_id:
                        type: integer
                        example: 1234
                  warnings:
                   $ref: '#/components/schemas/InvoiceWarnings'
        '404':
          description: Invoice not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: "Invoice not found"
                message: "Invoice with ID 1234 not found."
                code: 404
        '500':
          description: An error occurred while fetching data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /invoices/{invoice_id}/mark-as-paid:
    patch:
      security:
        - bearerAuth: []
      tags:
        - invoices
      summary: "Mark invoice as paid"
      operationId: markAsPaid
      description: "Marks specified invoice as paid (or credit note as refunded)"
      parameters:
        - in: path
          name: invoice_id
          description: "Invoice ID to mark as paid"
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: "Success: Invoice marked as paid (or credit note marked as refunded)"
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  status:
                    type: string
                    example: "success"
                  message:
                    type: string
                    example: "Invoice marked as paid"
                  invoice_id:
                    type: integer
                    example: 1234
        '404':
          description: "Invoice not found"
        '406':
          description: "Invoice already marked as paid (or credit note already marked as refunded)"
        '500':
          description: "An error occurred while fetching data"


  /invoices/{invoice_id}/external:
    patch:
      security:
        - bearerAuth: []
      tags:
        - external
      summary: "Set external ID and data"
      operationId: setExternal
      description: "Set accounting system document ID and data related to the Bilberry invoice. This will let Bilberry know that the invoice has been exported to the accounting system and Bilberry can show the ID in the external system to the end user"
      parameters:
        - in: path
          name: invoice_id
          description: "Invoice ID store related data for"
          required: true
          schema:
            type: integer
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
                - external_id
              properties:
                external_id:
                  type: string
                external_data:
                  type: object
            example:
              external_id: "ref12345"
              external_data:
                field1: "value 1"
                more_data:
                  more values: "more info"
      responses:
        '200':
          description: "Success: Invoice external data updated"
        '404':
          description: "Invoice not found"
        '500':
          description: "An error occurred while storing external data"

    get:
      security:
        - bearerAuth: []
      tags:
        - external
      summary: "Get the external ID and data"
      operationId: getExternal
      description: "Get the external ID and data stored on the Bilberry invoice"
      parameters:
        - in: path
          name: invoice_id
          description: "Invoice ID to retrieve data for"
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: "Success: Invoice external data found"
          content:
            application/json:
              schema:
                type: object
                properties:
                  invoice_id:
                    type: integer
                    example: 1234
                  external_id:
                    type: string
                    example: "ref4321"
                  external_data:
                    type: object
                    example:
                      test: "data"
        '404':
          description: "Invoice not found"
        '500':
          description: "An error occurred while fetching data"

  /vats:
    get:
      security:
        - bearerAuth: []
      tags:
        - account ledgers
      summary: "List all VATs"
      operationId: getVats
      description: "Get VAT details"
      parameters:
        - in: query
          name: default_only
          description: Set default_only=1 to only return default ledger per VAT %
          required: false
          schema:
            type: integer
      responses:
        '200':
          description: "VATs found"
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Vat'
        '500':
          description: An error occurred while fetching data
  /payment-methods:
    get:
      security:
        - bearerAuth: []
      tags:
        - account ledgers
      summary: "List all payment methods"
      operationId: getPaymentMethods
      description: "Get Payment Method details"
      responses:
        '200':
          description: "Payment methods found found"
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PaymentMethod'
        '500':
          description: An error occurred while fetching data

  /invoice-types:
    get:
      security:
        - bearerAuth: []
      tags:
        - account ledgers
      summary: "List all Bilberry invocie types"
      operationId: getInvoiceTypes
      description: "Get Invoice type details"
      responses:
        '200':
          description: "Invoice types found found"
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/InvoiceType'
        '500':
          description: An error occurred while fetching data

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    IncludeUnpaidOnline:
      in: query
      name: include_unpaid_online
      description: "Set include_unpaid_online=1 to include unpaid invoices with the Online payment method. These are excluded by default, as they are not relevant for accounting"
      required: false
      schema:
        type: integer
        enum: [0, 1]
        default: 0
  schemas:
    Error:
      type: object
      properties:
        error:
          type: string
          example: "Invalid date field"
        message:
          type: string
          example: "Date field must be either invoice_date, delivery_date, updated_at or closed_at"
        code:
          type: integer
          example: 400

    InvoiceType:
      type: object
      properties:
        id:
          type: integer
          example: 2
        name:
          type: string
          example: "Online Booking"

    PaymentMethod:
      type: object
      properties:
        id:
          type: integer
          example: 23
        name:
          type: string
          example: "Online"
        is_public:
          type: integer
          format: boolean
          example: 1
          description: "Value is 0 if only used internally, and not an option to be used on user created invoices."
        ledger_account:
          type: integer
          nullable: true
          description: "Account for bookkeeping"
          example: 1915

    Vat:
      type: object
      properties:
        id:
          type: integer
          example: 3
        name:
          type: string
          example: "Car Charter 15% Tax"
          description: "Internal name for VAT"
        display_name:
          type: string
          example: "Airport transfer 15% Tax"
          description: "User-facing name for VAT"
        decimal:
          type: number
          description: "VAT % as decimal 1.25 for 25%"
          example: "1.25"
        ledger_account:
          type: integer
          example: 3018
          nullable: true
        visbook_product_id:
          type: integer
          example: 23
          description: "VisBook product ID, if Bilberry has integration with VisBook"
          nullable: true
        visbook_unit_id:
          type: integer
          example: 514
          description: "VisBook unit ID, if Bilberry has integration with VisBook"
          nullable: true
        is_giftcard:
          type: integer
          format: boolean
          example: 1
          description: "1 if VAT is default VAT for giftcards. Only one VAT has this enabled"
        is_deposit:
          type: integer
          format: boolean
          example: 0
          description: "1 if VAT is default VAT for deposit. Only one VAT has this enabled"
        is_default:
          type: integer
          format: boolean
          example: 0
          description: "1 if VAT is default VAT for this VAT %. Only one per VAT % has this enabled"
        is_accommodation:
          type: integer
          format: boolean
          example: 0
          description: "1 if VAT is default VAT for accommodation product. Only one VAT has this enabled"
        department_id:
          type: integer
          nullable: true
          example: 8
          description: "Department ID from accounting system. This is used for subaccount 1"
        subaccount2:
          type: string
          nullable: true
          example: "00"
          description: "Subaccount 2, used for deferred revenue turnover"
        subaccount3:
          type: string
          nullable: true
          example: "003"
          description: "Subaccount 3, used for deferred revenue turnover"
        is_hidden:
          type: integer
          format: boolean
          example: 0
          description: "1 if VAT is no longer used, and should be hidden from the fron-end so it cannot be used in new orders"
        created_at:
          type: string
          format: date-time
          example: "2021-05-10T14:25:06.000000+02:00"
        updated_at:
          type: string
          format: date-time
          example: "2021-05-14T14:25:06.000000+02:00"
        deleted_at:
          type: string
          format: date-time
          example: "2021-05-19T14:25:06.000000+02:00"
          nullable: true



    InvoiceWarnings:
      type: array
      description: "Warnings if account ledgers are missing for VATs or Payment Mathods"
      items:
        type: string
        example: "VAT ledger missing for VAT IDs: 28, 68, 27"

    Invoice:
      type: object
      required:
        - invoice_id
        - type
        - status
        - invoice_date
        - delivery_date
        - invoice_due_date
      properties:
        invoice_id:
          type: integer
          example: 1234
        erp_invoice_reference:
          type: string
          description: "Unique reference for the invoice across Bilberry installations, in the format {subdomain}:{invoice_id}"
          example: "acme:1234"
        type:
          type: string
          description: "Specifies if the document is an invoice or credit note"
          enum: [invoice, creditnote]
          example: invoice
        status:
          type: string
          description: "The invoice status can be open(unpaid/unrefunded), closed(paid/refunded) or canceled "
          enum: [open, closed, cancelled]
          example: open
        invoice_lang:
          type: string
          description: "Invoice language. Project language for private events, otherwise 'nb' if the billing country is Norway and 'en' for other countries"
          example: nb
        invoice_date:
          type: string
          format: date-time
          description: "Invoice date. If the invoice date is before the 'move orders before date' accounting setting, the current date is returned instead"
          example: 2024-07-10T15:08:39.000000+02:00
        delivery_date:
          type: string
          format: date-time
          example: 2024-07-10T15:08:39.000000+02:00
        invoice_due_date:
          type: string
          format: date-time
          example: 2024-07-10T15:08:39.000000+02:00
        updated_at:
          type: string
          format: date-time
          example: 2024-07-10T15:08:39.000000+02:00
        orderlines_updated_at:
          type: string
          format: date-time
          description: "Latest update time of the orders, order lines and order prices on the invoice"
          example: 2024-07-10T15:08:39.000000+02:00
        closed_at:
          type: string
          format: date-time
          description: "Date the invoice was paid, or the credit note was refunded"
          example: 2024-07-10T15:08:39.000000+02:00
          nullable: true
        cancelled_at:
          type: string
          format: date-time
          example: 2024-07-10T15:08:39.000000+02:00
          nullable: true
        currency:
          type: string
          example: NOK
        creditnote_of_invoice_id:
          type: integer
          example: 1235
          description: "For credit notes: the ID of the original invoice it was created from"
          nullable: true
        billing_info:
          $ref: '#/components/schemas/BillingInfo'
        contacts:
          type: array
          description: "Contacts from the orders on the invoice, in the format 'name (email)'"
          items:
            type: string
            example: "John Doe (john@example.com)"
        info_lines:
          type: array
          description: "Additional information lines for the invoice (attention, project name and contacts), depending on accounting settings"
          items:
            type: string
            example: "Att: John Doe"
        project_name:
          type: string
          nullable: true
          description: "Project name if the invoice belongs to a private event"
          example: "Acme Inc company trip"
        salesperson:
          $ref: '#/components/schemas/Salesperson'
        attention:
          type: string
          description: "Attention field can be used by travel agents to specify a reference code for the booking or the person the booking is for"
          example: "att: John Doe"
        reference:
          type: string
          nullable: true
          description: "Invoice reference. Based on accounting settings it is the order name(s), the project name or the attention field. Agent invoices default to 'agent invoice'"
          example: "John Doe"
        invoice_type_id:
          type: integer
          example: 1
        invoice_type:
          type: string
          example: Faktura
        payment_method_id:
          type: integer
          example: 1
        payment_method:
          type: string
          example: Invoice
        payment_method_exclude:
          type: integer
          format: boolean
          description: "1 if the payment method is excluded from turnover"
          example: 0
        erp_department_number:
          type: string
          nullable: true
          description: "Department number in the accounting system (Tripletex setting)"
          example: "10"
        orderlines:
          type: array
          items:
            $ref: '#/components/schemas/Orderline'
        payments:
          type: array
          items:
            $ref: '#/components/schemas/Payment'

        subtotal:
          type: number
          description: "Total inc. VAT from orderlines"
          example: 1000
        subtotal_ex_vat:
          type: number
          description: "Total ex. VAT from orderlines"
          example: 800
        payments_total:
          type: number
          example: 1000
        vat_total:
          type: number
          description: "Total VAT from orderlines"
          example: 200
        balance:
          type: number
          description: "subtotal - payments_total. 0 if paid in full. Negative if overpaid, and positive if partially paid."
          example: 0
        warnings:
          type: array
          description: "Warnings for this invoice, such as missing VAT ledgers"
          items:
            type: string
            example: "VAT ledger missing for product id: 28, VAT: 12% - Mountain biking"
        checksum:
          type: string
          description: "MD5 checksum of the accounting-relevant invoice data (dates, payment method, totals, orderlines and giftcard/deposit payments). Changes when any of this data changes, so it can be used to detect if an exported invoice must be updated"
          example: "5d41402abc4b2a76b9719d911017c592"



    BillingInfo:
      required:
        - name
      type: object
      properties:
        name:
          type: string
          example: "ACME Hotel"
        email:
          type: string
          format: email
          example: 'reception@acmehotel.com'
        address1:
          type: string
          example: "Flat 2B"
        address2:
          type: string
          example: "12th Street"
        zip:
          type: string
          example: "6004"
        city:
          type: string
          example: "ÅLESUND"
        country:
          type: string
          example: "Norge"
        country_code:
          type: string
          example: "NO"
        erp_customer_number:
          type: string
          nullable: true
          description: "Customer number in the accounting system. From the Bilberry customer if set, otherwise from the payment method"
          example: "10045"
        customer:
          $ref: '#/components/schemas/Customer'


    Customer:
      type: object
      description: "Bilberry customer. Returned as an empty array if the invoice has no customer"
      properties:
        id:
          type: integer
          example: 100012
        name:
          type: string
          example: "ACME Hotel"
        email:
          type: string
          format: email
          example: "reception@acmehotel.com"
        phone:
          type: string
          example: 408-867-5309
        address1:
          type: string
          example: "Flat 2B"
        address2:
          type: string
          example: "12th Street"
        zip:
          type: string
          example: "6004"
        city:
          type: string
          example: "ÅLESUND"
        country:
          type: string
          example: "Norge"
        country_code:
          type: string
          example: "NO"
        org_nr:
          type: string
          example: "9812345687"
        is_agent:
          type: integer
          example: 1
        email_invoice:
          type: string
          format: email
          example: "reception@acmehotel.com"
        is_gofjords:
          type: integer
          format: boolean
          example: 0
    Salesperson:
      type: object
      description: "Project manager of the project. Returned as an empty array if not set"
      properties:
        id:
          type: integer
          example: 2072
        name:
          type: string
          example: "John Salesman"
        external_ref:
          type: string
          description: External reference can be added in Bilberry if needed to connect with a salesperson in the accounting system
          example: "134"
    Payment:
      type: object
      properties:
        payment_id:
          type: string
          description: |
            Payment ID prefixed with payment type:
            - `payment:{invoice_id}` - payment of the invoice (only if the invoice is paid/refunded)
            - `giftcard:{order_line_id}` - giftcard used as payment
            - `deposit:{order_line_id}` - deposit used as payment
            - `sponsored_giftcard:{order_line_id}` - sponsored giftcard used as payment
          example: "giftcard:1234"
        name:
          type: string
          example: "Invoice"
        description:
          type: string
          example: "Stripe payment #SHK5G3S"
        payment_method:
          type: string
          example: "Invoice"
        payment_method_id:
          type: integer
          example: 1
        amount:
          type: number
          description: "Payment amount in currency"
          example: 1000
        account_ledger:
          type: integer
          description: "Bookkeeping account"
          example: 1905
        paid_at:
          type: string
          format: date-time
          example: 2024-07-10T15:08:39.000000+02:00
        accounting_payment_method_id:
          type: string
          nullable: true
          description: "Payment method ID in the accounting system, matched on account ledger (Tripletex only)"
          example: "6841399"
        accounting_payment_method:
          type: object
          nullable: true
          description: "Payment method in the accounting system, matched on account ledger (Tripletex only)"
          properties:
            PaymentID:
              type: string
              example: "6841399"
            AccountCode:
              type: string
              example: "1900"
            Payment_Name:
              type: string
              example: "Kontant"

    Orderline:
      type: object
      description: "Discount lines have negative quantity and positive unit price"
      properties:
        id:
          type: integer
          example: 22465
        order_line_id:
          type: integer
          description: "ID of the order line. An order line can have multiple orderlines in the API, one per VAT rate"
          example: 18234
        last_modified_at:
          type: string
          format: date-time
          description: "Latest update time of the order, order line or order price"
          example: 2024-07-10T15:00:00.000000+02:00
        description:
          type: string
          description: "Orderline description, translated to the invoice language"
          example: "Mountain biking group tour"
        product:
          type: string
          example: "Mountain biking"
        product_id:
          type: integer
          example: 28
        product_is_resale:
          type: integer
          format: boolean
          example: 0
        location_id:
          type: integer
          nullable: true
          example: 4
        start:
          type: string
          format: date-time
          example: 2024-07-10T15:00:00.000000+02:00
        end:
          type: string
          format: date-time
          example: 2024-07-10T15:00:00.000000+02:00
        unit_price_inc_vat:
          type: number
          description: "Price per unit inc VAT before discounts"
          example: 2450
        unit_price_ex_vat:
            type: number
            description: "Price per unit ex VAT before discounts"
            example: 2187.50
        pax:
          type: integer
          example: 4
        quantity:
          type: integer
          example: 4
        total_price:
          type: number
          description: "Total price inc VAT befre discounts"
          example: 4800
        discount_percent:
          type: integer
          description: "Discount in %"
          example: "10"
        discount_amount:
          type: number
          description: "Discount amount in currency, calculated from discount_percent and total_price"
          example: 480
        total_inc_vat:
          type: number
          description: "Total amount inc VAT after discounts"
          example: 4320
        vat_amount:
          type: number
          description: "VAT amount in currency"
          example: 462.86
        total_ex_vat:
          type: number
          description: "Tota amount ex VAT after discounts"
          example: 3857.14
        is_giftcard:
          type: integer
          format: boolean
          example: 0
        is_deposit:
          type: integer
          format: boolean
          example: 0
        vat:
          type: object
          properties:
            id:
              type: number
              description: "VAT ID"
              example: 68
            name:
              type: string
              description: "VAT name"
              example: "Transport Internal 12%"
            percent:
              type: integer
              description: "VAT %"
              example: 12
            account_ledger:
              type: integer
              description: "Bookkeeping account"
              example: 3087
            department_id:
              type: integer
              example: 3
              description: "Internal Bilberry department ID. From the product location's destination if set, otherwise from the VAT"
            department_ext_reference:
              type: string
              example: "bergen-office"
              description: "Reference to department in external accounting system"
        project:
          $ref: '#/components/schemas/Project'
        plan:
          $ref: '#/components/schemas/Plan'

    Project:
      type: object
      properties:
        id:
          type: integer
          example: 107845
        name:
          type: string
          description: "Bilberry project name"
          example: "Acme Inc company trip"
        category_id:
          type: integer
          description: "Project category ID"
        category_name:
          type: string
          nullable: true
          description: "Project category name"
          example: "Private event"
        confirmed_at:
          type: string
          format: date-time
          nullable: true
          description: "Date the project was confirmed"
          example: 2024-06-10T12:00:00.000000+02:00
        start:
          type: string
          format: date
          description: "Project start date"
          example: 2024-07-10
        end:
          type: string
          format: date
          description: "Project end date"
          example: 2024-07-13
        project_lang:
          type: string
          nullable: true
          example: en
    Plan:
      type: object
      properties:
        id:
          type: integer
          example: 35426
        name:
          type: string
          description: "Bilberry plan name"
          example: "Wildlife Sea Safari"
        start:
          type: string
          format: date-time
          nullable: true
          example: 2024-07-10T12:00:00.000000+02:00
        end:
          type: string
          format: date-time
          nullable: true
          example: 2024-07-10T15:00:00.000000+02:00
        created_at:
          type: string
          format: date-time
          nullable: true
          example: 2024-05-02T09:30:00.000000+02:00
